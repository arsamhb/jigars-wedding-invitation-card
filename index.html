<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    (function () {
      function syncAppHeight() {
        var h =
          (window.visualViewport && window.visualViewport.height) ||
          window.innerHeight;
        document.documentElement.style.setProperty(
          "--app-height",
          Math.round(h) + "px"
        );
      }
      syncAppHeight();
      window.addEventListener("resize", syncAppHeight, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncAppHeight, {
          passive: true,
        });
      }
    })();
  </script>
  <title>Pouya &amp; Ghazal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=WindSong:wght@400;500&family=M+PLUS+1p:wght@100;300;400&family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }

    :root {
      --nude-bg: #f0f4ec;
      --nude-panel: rgb(240, 234, 237);
      --nude-text: #6a7a4a;
      --nude-text-soft: #9c8095;
      --viewport-height: 100vh;
      --viewport-height: 100svh;
      --viewport-height: 100dvh;
      --app-height: var(--viewport-height);
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
      height: var(--app-height);
    }

    body {
      min-height: 100%;
      min-height: -webkit-fill-available;
      min-height: var(--app-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
      color: var(--nude-text);
      background: var(--nude-panel);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .chooser {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.25rem;
      text-align: center;
      animation: chooser-fade-in 0.9s ease both;
    }

    @keyframes chooser-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chooser__script {
      font-family: "WindSong", cursive;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 2.9rem);
      color: var(--nude-text-soft);
      line-height: 1.1;
    }

    .chooser__names {
      font-family: "M PLUS 1p", sans-serif;
      font-weight: 100;
      letter-spacing: 0.08em;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      color: var(--nude-text);
    }

    .chooser__prompt {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      letter-spacing: 0.02em;
      color: var(--nude-text-soft);
    }

    .chooser__prompt span[lang="fa"] {
      font-family: "Noto Sans Arabic", sans-serif;
    }

    .chooser__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem;
      margin-top: 0.25rem;
    }

    .chooser__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 9.5rem;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--nude-text) 45%, transparent);
      background: transparent;
      color: var(--nude-text);
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      letter-spacing: 0.02em;
      text-decoration: none;
      transition:
        background 0.35s ease,
        color 0.35s ease,
        border-color 0.35s ease;
    }

    .chooser__link:hover,
    .chooser__link:focus-visible {
      background: var(--nude-text);
      color: var(--nude-panel);
      border-color: var(--nude-text);
      outline: none;
    }

    .chooser__link--fa {
      font-family: "Noto Sans Arabic", sans-serif;
    }

    .chooser__link--en {
      font-family: "Cormorant Garamond", Georgia, serif;
    }
  </style>
</head>
<body>
  <main class="chooser">
    <p class="chooser__script">save the date</p>
    <h1 class="chooser__names">Pouya &amp; Ghazal</h1>
    <p class="chooser__prompt">
      <span lang="fa" dir="rtl">زبان خود را انتخاب کنید</span>
      &nbsp;·&nbsp;
      <span lang="en">Choose your language</span>
    </p>
    <div class="chooser__actions">
      <a class="chooser__link chooser__link--fa" href="fa/index.html" lang="fa" dir="rtl">فارسی</a>
      <a class="chooser__link chooser__link--en" href="en/index.html" lang="en" dir="ltr">English</a>
    </div>
  </main>
</body>
</html>
